# profil test : seulement les valeurs fixes
# datasource, issuer-uri, jwk-set-uri et app.keycloak.public-url sont injectés par AbstractIntegrationTest
spring:
  jpa:
    hibernate:
      # le schéma est recréé dans la base postgres vierge
      ddl-auto: create-drop
    show-sql: false

server:
  port: 0

app:
  cors:
    allowed-origins: http://localhost:3000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    oauth:
      client-id: swagger-ui
