# Ici je ne mets aucune valeur en dur : tout vient du fichier .env
# (regarde .env.example pour voir la liste des variables à remplir).
# Si on lance l'appli avec Docker, les vraies variables d'environnement
# passent avant le .env, donc pas de souci.
# Volontairement pas de valeur par défaut : si une variable manque,
# l'appli plante au démarrage et on voit tout de suite laquelle.
spring:
  application:
    name: transaction

  # Là on dit à Spring d'aller lire le .env à la racine du projet.
  # Le "optional" évite une erreur quand il n'y a pas de .env (Docker, CI...).
  config:
    import: optional:file:.env[.properties]

  # Connexion à PostgreSQL
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # "update" c'est pratique en dev, mais en prod on utilise "validate" avec Flyway ou Liquibase
      ddl-auto: ${JPA_DDL_AUTO}
    open-in-view: false
    # Mettre à true dans le .env si on veut voir les requêtes SQL pour débugger
    show-sql: ${JPA_SHOW_SQL}
    properties:
      hibernate:
        format_sql: true

  # Sécurité : l'API vérifie les jetons envoyés par Keycloak
  security:
    oauth2:
      resourceserver:
        jwt:
          # Doit être exactement le "iss" qu'on trouve dans le jeton.
          # C'est l'adresse du realm (pas celle de /token), vue depuis l'interface de OPENID EndPoint Configuration.
          issuer-uri: ${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM}
          # Là l'API va chercher les clés pour vérifier la signature.
          # Dans Docker il faut l'adresse interne (genre http://keycloak:8080).
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs

server:
  port: ${SERVER_PORT}

# On expose juste health et info, rien d'autre
management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  keycloak:
    # Adresse du realm pour le navigateur. Le code Java (OpenApiConfig)
    # rajoute lui-même /protocol/openid-connect/auth et /token derrière.
    public-url: ${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM}
  cors:
    # Les adresses qui ont le droit d'appeler l'API ,le front par exemple
    allowed-origins: ${APP_CORS_ORIGINS}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED}
    path: /swagger-ui.html
    persist-authorization: true
    display-request-duration: true
    operations-sorter: alpha
    tags-sorter: alpha
    oauth:
      # Le client Keycloak utilisé par le bouton "Authorize" de Swagger
      client-id: ${KEYCLOAK_SWAGGER_CLIENT_ID}
      use-pkce-with-authorization-code-grant: true
  # On ne documente que notre package
  packages-to-scan: com.banque.transaction