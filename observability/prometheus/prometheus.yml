global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # API Spring Boot : port de management (non publié), réseau Docker uniquement
  - job_name: banque-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8283"]

  # Keycloak : métriques sur le port de management 9000 (KC_METRICS_ENABLED=true)
  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]

  # PostgreSQL de l'API (via postgres-exporter)
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
