# Règles d'alerte évaluées par Prometheus (visibles dans Prometheus > Alerts et dans Grafana).
# Pour recevoir des notifications (mail, Slack...), ajouter un Alertmanager.
groups:
  - name: banque-api
    rules:
      - alert: ApiDown
        expr: up{job="banque-api"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "L'API banque ne répond plus au scrape Prometheus"

      - alert: ApiTauxErreurs5xx
        expr: |
          sum(rate(http_server_requests_seconds_count{application="transaction",status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count{application="transaction"}[5m])) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Plus de 5 % de réponses 5xx sur 5 minutes"

      - alert: ApiLatenceP95Elevee
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{application="transaction",uri!~"/actuator.*"}[5m]))) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Latence p95 supérieure à 1 s depuis 10 minutes"

      - alert: PicRefusAuthentification
        expr: sum(rate(http_server_requests_seconds_count{application="transaction",status=~"401|403"}[5m])) > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Nombre anormal de 401/403 (jetons invalides, tentative d'accès non autorisé ?)"

      - alert: PoolConnexionsSature
        expr: hikaricp_connections_pending{application="transaction"} > 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Des requêtes attendent une connexion PostgreSQL (pool saturé)"

      - alert: HeapJvmProcheDuMax
        expr: sum(jvm_memory_used_bytes{application="transaction",area="heap"}) / sum(jvm_memory_max_bytes{application="transaction",area="heap"}) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Heap JVM > 90 % depuis 10 minutes"

  - name: dependances
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "PostgreSQL injoignable depuis postgres-exporter"

      - alert: KeycloakDown
        expr: up{job="keycloak"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Keycloak ne répond plus au scrape (plus personne ne peut se connecter)"
