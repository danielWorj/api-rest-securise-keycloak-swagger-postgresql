name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une seule exécution par branche : un nouveau push annule la précédente
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + tests d'intégration
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"      # = java.version du pom.xml
          cache: maven            # cache ~/.m2 selon le hash des pom.xml

      # Les runners ubuntu-latest embarquent Docker : Testcontainers fonctionne tel quel,
      # pas besoin de "services:" PostgreSQL/Keycloak ni de fichier .env pour les tests.
      # Pré-téléchargement en parallèle (mêmes images que Containers.java) pour éviter
      # que le pull de Keycloak ne mange le timeout de démarrage.
      - name: Pré-télécharger les images des tests
        run: |
          docker pull postgres:17-alpine &
          docker pull quay.io/keycloak/keycloak:26.2 &
          wait

      - name: Droits d'exécution du wrapper Maven
        run: chmod +x mvnw

      # Tous les tests du projet sont des *IT : `mvn test` (Surefire) n'en lancerait aucun.
      # `verify` exécute Failsafe (integration-test + verify) et fait échouer le job si un IT échoue.
      - name: mvn verify
        run: ./mvnw -B -ntp verify

      - name: Publier les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: |
            target/failsafe-reports/
            target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: Build de l'image Docker
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Vérifie que le Dockerfile compile (sans pousser l'image : c'est le rôle du CD)
      - name: Build (sans push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max