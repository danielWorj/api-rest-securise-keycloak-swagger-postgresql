name: CD

# Se déclenche uniquement quand le workflow "CI" est terminé sur main.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false   # on ne coupe jamais un déploiement en cours

jobs:
  publish-image:
    name: Publier l'image sur GHCR
    # tests d'intégration verts, ou lancement manuel
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          # le commit qui a passé la CI (et pas forcément le dernier de main)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: vars
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action met le nom de l'image en minuscules (obligatoire pour GHCR,
      # alors que le propriétaire du dépôt contient des majuscules)
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Déployer sur le serveur
    needs: publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Environnement GitHub "production" : permet d'ajouter une validation manuelle
    # (Settings > Environments > production > Required reviewers)
    environment: production

    steps:
      - name: Déploiement via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            export API_TAG=${{ needs.publish-image.outputs.tag }}
            docker compose -f docker-compose.prod.yaml pull api
            docker compose -f docker-compose.prod.yaml up -d
            docker image prune -f